<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="botGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#14b8a6" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b171f" />
      <stop offset="100%" stop-color="#040b0f" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="32" height="32" rx="7" fill="url(#bgGrad)" />
  <rect width="32" height="32" rx="7" fill="none" stroke="#10b981" stroke-width="1.2" stroke-opacity="0.4" />

  <!-- Antenna -->
  <path d="M16 6v3" stroke="url(#botGrad)" stroke-width="1.5" stroke-linecap="round" />
  <circle cx="16" cy="5" r="1.5" fill="#34d399" />

  <!-- Robot Head -->
  <rect x="7" y="9" width="18" height="15" rx="3.5" fill="#0f232a" stroke="url(#botGrad)" stroke-width="1.5" />

  <!-- Eyes -->
  <circle cx="12" cy="15" r="1.8" fill="#34d399" />
  <circle cx="20" cy="15" r="1.8" fill="#34d399" />

  <!-- Smile / Donation Heart Accent -->
  <path d="M12.5 19.5c1 1.2 2.5 1.8 3.5 1.8s2.5-.6 3.5-1.8" stroke="#34d399" stroke-width="1.2" stroke-linecap="round" fill="none" />
</svg>
